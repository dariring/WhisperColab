name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: pip install -r requirements-dev.txt
      - name: Install FFmpeg for M4A/AAC integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check Python syntax and notebook format
        run: |
          python -m py_compile whisper_worker.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path("WhisperColab.ipynb").read_text(encoding="utf-8"))
          assert notebook["nbformat"] == 4
          for cell in notebook["cells"]:
              if cell["cell_type"] == "code":
                  compile("".join(cell["source"]), "WhisperColab.ipynb", "exec")
          PY
      - name: Run tests
        run: python -m pytest -q
